<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Laptop showing the WEGN Store dashboard, tablet showing the WEGN Restaurants dashboard, and smartphone showing the WEGN Appointments booking screen</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcfa"/>
      <stop offset="1" stop-color="#f4f8f2"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6bc72c"/>
      <stop offset="1" stop-color="#8ee23a"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="shadowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="storeScreen"><rect x="66" y="146" width="468" height="388" rx="10"/></clipPath>
    <clipPath id="restScreen"><rect x="624" y="214" width="292" height="222" rx="8"/></clipPath>
    <clipPath id="apptScreen"><rect x="1002" y="172" width="136" height="436" rx="16"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="url(#bgGrad)"/>
  <circle cx="990" cy="130" r="230" fill="#6bc72c" opacity="0.10" filter="url(#softBlur)"/>
  <circle cx="130" cy="700" r="190" fill="#8ee23a" opacity="0.09" filter="url(#softBlur)"/>

  <!-- ground shadows -->
  <ellipse cx="300" cy="602" rx="270" ry="16" fill="#0a1a0c" opacity="0.12" filter="url(#shadowBlur)"/>
  <ellipse cx="770" cy="528" rx="175" ry="13" fill="#0a1a0c" opacity="0.12" filter="url(#shadowBlur)"/>
  <ellipse cx="1070" cy="638" rx="95" ry="12" fill="#0a1a0c" opacity="0.12" filter="url(#shadowBlur)"/>

  <!-- ================= LAPTOP — WEGN Store ================= -->
  <g>
    <rect x="140" y="550" width="320" height="24" rx="8" fill="#1b271d"/>
    <rect x="270" y="556" width="60" height="10" rx="5" fill="#33443a"/>
    <rect x="50" y="130" width="500" height="420" rx="22" fill="#0d140e"/>
    <rect x="66" y="146" width="468" height="388" rx="10" fill="#ffffff"/>
    <g clip-path="url(#storeScreen)">
      <rect x="66" y="146" width="468" height="64" fill="#133b19"/>
      <rect x="80" y="162" width="34" height="34" rx="8" fill="#ffffff" opacity="0.14"/>
      <circle cx="97" cy="179" r="6" fill="#8ee23a"/>
      <text x="128" y="190" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">WEGN Store</text>

      <rect x="82" y="230" width="140" height="80" rx="12" fill="#f5f8f3" stroke="#dfe7dc"/>
      <text x="98" y="256" font-family="Arial, sans-serif" font-size="15" fill="#667067">Today's Sales</text>
      <text x="98" y="291" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#0d140e">$482</text>

      <rect x="234" y="230" width="140" height="80" rx="12" fill="#f5f8f3" stroke="#dfe7dc"/>
      <text x="250" y="256" font-family="Arial, sans-serif" font-size="15" fill="#667067">Orders</text>
      <text x="250" y="291" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#0d140e">36</text>

      <rect x="386" y="230" width="148" height="80" rx="12" fill="#f5f8f3" stroke="#dfe7dc"/>
      <text x="402" y="256" font-family="Arial, sans-serif" font-size="15" fill="#667067">Low Stock</text>
      <text x="402" y="291" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#0d140e">4</text>

      <text x="82" y="340" font-family="Arial, sans-serif" font-size="15" fill="#667067">Sales this week</text>
      <line x1="82" y1="470" x2="518" y2="470" stroke="#dfe7dc" stroke-width="2"/>
      <rect x="90" y="400" width="34" height="70" rx="6" fill="url(#barGrad)"/>
      <rect x="160" y="370" width="34" height="100" rx="6" fill="url(#barGrad)"/>
      <rect x="230" y="410" width="34" height="60" rx="6" fill="url(#barGrad)"/>
      <rect x="300" y="350" width="34" height="120" rx="6" fill="url(#barGrad)"/>
      <rect x="370" y="380" width="34" height="90" rx="6" fill="url(#barGrad)"/>
      <rect x="440" y="330" width="34" height="140" rx="6" fill="url(#barGrad)"/>
    </g>
    <rect x="50" y="130" width="500" height="420" rx="22" fill="none" stroke="#000000" opacity="0.05"/>
  </g>

  <!-- ================= TABLET — WEGN Restaurants ================= -->
  <g>
    <polygon points="770,450 730,504 810,504" fill="#0d140e"/>
    <rect x="720" y="500" width="100" height="14" rx="7" fill="#0d140e"/>
    <rect x="610" y="200" width="320" height="250" rx="18" fill="#0d140e"/>
    <rect x="624" y="214" width="292" height="222" rx="8" fill="#ffffff"/>
    <g clip-path="url(#restScreen)">
      <rect x="624" y="214" width="292" height="50" fill="#133b19"/>
      <rect x="634" y="224" width="28" height="28" rx="7" fill="#ffffff" opacity="0.14"/>
      <circle cx="648" cy="238" r="5" fill="#8ee23a"/>
      <text x="672" y="246" font-family="Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff">WEGN Restaurants</text>

      <text x="636" y="286" font-family="Arial, sans-serif" font-size="13" fill="#667067">Tables</text>
      <rect x="636" y="294" width="40" height="34" rx="8" fill="#ffffff" stroke="#dfe7dc" stroke-width="2"/>
      <rect x="684" y="294" width="40" height="34" rx="8" fill="#6bc72c"/>
      <rect x="732" y="294" width="40" height="34" rx="8" fill="#ffffff" stroke="#dfe7dc" stroke-width="2"/>
      <rect x="636" y="336" width="40" height="34" rx="8" fill="#6bc72c"/>
      <rect x="684" y="336" width="40" height="34" rx="8" fill="#ffffff" stroke="#dfe7dc" stroke-width="2"/>
      <rect x="732" y="336" width="40" height="34" rx="8" fill="#ffffff" stroke="#dfe7dc" stroke-width="2"/>

      <rect x="804" y="282" width="96" height="140" rx="10" fill="#f5f8f3" stroke="#dfe7dc"/>
      <text x="812" y="300" font-family="Arial, sans-serif" font-size="12" fill="#667067">Order #12</text>
      <rect x="812" y="312" width="70" height="8" rx="4" fill="#dfe7dc"/>
      <rect x="812" y="332" width="56" height="8" rx="4" fill="#dfe7dc"/>
      <rect x="812" y="352" width="62" height="8" rx="4" fill="#dfe7dc"/>
      <rect x="812" y="392" width="80" height="26" rx="13" fill="#133b19"/>
      <text x="826" y="410" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" textLength="50" lengthAdjust="spacingAndGlyphs">Send</text>
    </g>
  </g>

  <!-- ================= PHONE — WEGN Appointments ================= -->
  <g>
    <rect x="990" y="160" width="160" height="460" rx="30" fill="#0d140e"/>
    <rect x="1002" y="172" width="136" height="436" rx="16" fill="#ffffff"/>
    <g clip-path="url(#apptScreen)">
      <rect x="1002" y="172" width="136" height="90" fill="#133b19"/>
      <text x="1014" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#cce8c4">WEGN</text>
      <text x="1014" y="232" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" textLength="112" lengthAdjust="spacingAndGlyphs">Appointments</text>

      <rect x="1008" y="278" width="20" height="40" rx="10" fill="#ffffff" stroke="#dfe7dc" stroke-width="2"/>
      <text x="1013" y="302" font-family="Arial, sans-serif" font-size="11" fill="#0d140e">12</text>
      <rect x="1034" y="278" width="20" height="40" rx="10" fill="#6bc72c"/>
      <text x="1039" y="302" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">13</text>
      <rect x="1060" y="278" width="20" height="40" rx="10" fill="#ffffff" stroke="#dfe7dc" stroke-width="2"/>
      <text x="1065" y="302" font-family="Arial, sans-serif" font-size="11" fill="#0d140e">14</text>
      <rect x="1086" y="278" width="20" height="40" rx="10" fill="#ffffff" stroke="#dfe7dc" stroke-width="2"/>
      <text x="1091" y="302" font-family="Arial, sans-serif" font-size="11" fill="#0d140e">15</text>
      <rect x="1112" y="278" width="20" height="40" rx="10" fill="#ffffff" stroke="#dfe7dc" stroke-width="2"/>
      <text x="1117" y="302" font-family="Arial, sans-serif" font-size="11" fill="#0d140e">16</text>

      <rect x="1008" y="336" width="124" height="40" rx="10" fill="#f5f8f3" stroke="#dfe7dc"/>
      <text x="1020" y="361" font-family="Arial, sans-serif" font-size="14" fill="#0d140e">9:00 AM</text>
      <circle cx="1118" cy="356" r="7" fill="#ffffff" stroke="#dfe7dc" stroke-width="2"/>

      <rect x="1008" y="386" width="124" height="40" rx="10" fill="#ffffff" stroke="#6bc72c" stroke-width="2"/>
      <text x="1020" y="411" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0d140e">10:30 AM</text>
      <circle cx="1118" cy="406" r="7" fill="#6bc72c"/>
      <path d="M1115 406 l2 3 l5 -6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="1008" y="436" width="124" height="40" rx="10" fill="#f5f8f3" stroke="#dfe7dc"/>
      <text x="1020" y="461" font-family="Arial, sans-serif" font-size="14" fill="#0d140e">1:00 PM</text>
      <circle cx="1118" cy="456" r="7" fill="#ffffff" stroke="#dfe7dc" stroke-width="2"/>

      <rect x="1008" y="548" width="124" height="44" rx="22" fill="#133b19"/>
      <text x="1040" y="576" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff" textLength="86" lengthAdjust="spacingAndGlyphs">Book Now</text>

      <rect x="1050" y="592" width="40" height="5" rx="2.5" fill="#dfe7dc"/>
    </g>
  </g>
</svg>
